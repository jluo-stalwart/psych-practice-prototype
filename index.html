  multi('impact', 'Which parts of your life is it affecting?', [['work', 'Work or school'], ['relationships', 'Relationships'], ['family', 'Family'], ['social', 'Friends and social life'], ['sleep', 'Sleep'], ['selfcare', 'Looking after myself'], ['money', 'Money'], ['none', 'Not much', 1]]);
  longT('impact_example', "Can you give one example of how it's affecting your day-to-day life?", { when: someNot('impact', 'none'), deps: ['impact'], p: 0.9, optional: true });
  multi('helps', 'What helps, even a little?', [['talk', 'Talking to someone'], ['exercise', 'Exercise or getting outside'], ['sleep', 'Sleep'], ['meds', 'Medication'], ['people', 'Time with people'], ['alone', 'Time alone'], ['hobbies', 'Hobbies'], ['nothing', 'Nothing so far', 1]]);

  sec('Mood');
  say('s_phq', 'Next, a quick check across different areas. These are taps. First: over the last 2 weeks, how often have you been bothered by each of the following?');
  const PHQ_TEXT = ['Little interest or pleasure in doing things', 'Feeling down, depressed, or hopeless', 'Trouble falling or staying asleep, or sleeping too much', 'Feeling tired or having little energy', 'Poor appetite or overeating', 'Feeling bad about yourself, or that you are a failure or have let yourself or your family down', 'Trouble concentrating on things, such as reading the newspaper or watching television', 'Moving or speaking so slowly that other people could have noticed, or the opposite: being so fidgety or restless that you have been moving around a lot more than usual', 'Thoughts that you would be better off dead, or of hurting yourself in some way'];
  const PHQ_SHORT = ['little interest or pleasure', 'low mood or hopelessness', 'sleep problems', 'tiredness or low energy', 'appetite changes', 'feeling bad about self', 'trouble concentrating', 'slowed down or restless', 'thoughts of being better off dead or of self-harm'];
  PHQ_TEXT.forEach((t, i) => scale(PHQ[i], t, { eyebrow: `Over the last 2 weeks · ${i + 1} of 9` }));
  card('c_risk1', 'crisis', { when: phq9pos, deps: ['phq9'], p: 0.1 });
  choice('safe1', 'Are you safe right now?', SAFE, { when: phq9pos, deps: ['phq9'], p: 0.1, safeCheck: true });
  say('ns1', NOT_SAFE, { when: eq('safe1', 'notsafe'), deps: ['safe1'], urgent: true });

  sec('Alcohol and drugs');

  say('s_bg', 'Almost done. A few questions about your background.');
  shortT('grew_up', 'Where did you grow up?', { optional: true });
  choice('home_child', 'Growing up, did home feel...', [['stable', 'Mostly stable and supportive'], ['sometimes', 'Sometimes difficult'], ['often', 'Often difficult or unsafe']], { sensitive: true });
  choice('dev', 'Were there any problems with your birth or early development that you know of, like being born early or starting to talk late?', YNU);
  shortT('dev_detail', 'What do you know about it?', { when: eq('dev', 'yes'), deps: ['dev'], p: 0.1, optional: true });
  choice('edu', "What's the highest level of school you finished?", [['some_hs', 'Some high school'], ['hs', 'High school'], ['college', 'College or trade school'], ['uni', 'University degree'], ['grad', 'Graduate or professional degree']]);
  choice('school_diff', 'Did you have trouble at school, like learning difficulties, behaviour problems or bullying?', YN);
  shortT('school_detail', 'What kind of trouble?', { when: eq('school_diff', 'yes'), deps: ['school_diff'], p: 0.3, optional: true });
  choice('work_now', 'How are things at work or school right now?', [['well', 'Going well'], ['some', 'Some trouble'], ['lot', 'A lot of trouble']], { when: anyOf('daily', 'ft', 'pt', 'student'), deps: ['daily'], p: 0.7 });
  multi('supports', 'Who do you lean on for support?', [['partner', 'Partner'], ['family', 'Family'], ['friends', 'Friends'], ['community', 'A community or faith group'], ['professional', 'A counsellor or support worker'], ['nobody', 'Nobody right now', 1]]);
  longT('past_text', 'Is there anything about your upbringing or past experiences you would like your psychiatrist to know?', { optional: true, sensitive: true });
  choice('legal', 'Have you ever been in trouble with the law, like an arrest, charges or probation?', YN, { sensitive: true });
  shortT('legal_detail', 'What happened, and is anything still ongoing?', { when: eq('legal', 'yes'), deps: ['legal'], p: 0.1, optional: true });
  shortT('enjoy', 'What do you enjoy doing, or used to enjoy?', { optional: true });

  sec('Wrapping up');
  longT('anything', 'Is there anything else you would like your psychiatrist to know before your visit?', { optional: true });
  choice('hard', 'Was anything here hard to answer that you would rather talk about in person?', YN);
  shortT('hard_detail', 'What would you like to talk about? A word or two is enough.', { when: eq('hard', 'yes'), deps: ['hard'], p: 0.2, optional: true });
  say('done', a => `Thank you${named(a, ', ')}. That's everything. Your psychiatrist will read your answers before your appointment.`);

  // Typed answers get the same safety step as tapped ones. Straight after the first typed answer with words about suicide or self-harm come the crisis numbers and "Are you safe right now?"; after the first about harming someone, those numbers.
  const TYPED = Q.filter(n => ['text', 'short', 'list'].includes(n.type));
  TYPED.forEach(n => {
    const self = a => firstRisk(a, 'self') === n, others = a => firstRisk(a, 'others') === n;
    const at = { section: n.section, deps: [n.id], p: 0 }, ok = 'safe_t_' + n.id, notSafe = eq(ok, 'notsafe');
    Q.splice(Q.indexOf(n) + 1, 0,
      make('card', 'c_t_' + n.id, '', Object.assign({ kind: 'crisis', when: self }, at)),
      make('choice', ok, 'Are you safe right now?', Object.assign({ options: SAFE, when: self, safeCheck: true }, at)),
      make('say', 'ns_t_' + n.id, NOT_SAFE, Object.assign({ when: notSafe, urgent: true }, at)),
      make('choice', 'resume_t_' + n.id, "When you're ready, you can carry on.", Object.assign({ options: RESUME, when: notSafe }, at)),
      make('card', 'c_to_' + n.id, '', Object.assign({ kind: 'others', when: others }, at)));
  });

  /* ---------- engine helpers ---------- */
  const isQ = n => ['choice', 'multi', 'text', 'short', 'name', 'date', 'scale', 'list'].includes(n.type);
  const visible = (n, a) => !n.when || !!n.when(a);
  const qText = (n, a) => (typeof n.text === 'function' ? n.text(a) : n.text);
  const optLabel = (n, v) => { const o = (n.options || []).find(x => x.v === v); return o ? o.label : String(v); };
  const W = { choice: 6, scale: 5, multi: 10, short: 18, name: 18, date: 12, text: 110, list: 70 };
  function fmtEntry(n, e) {
    if (n.id === 'meds_tried') {
      const r = RESULT.find(x => x[0] === e.result);
      return [e.name, e.dose].filter(Boolean).join(' ') + (r ? ': ' + r[1].toLowerCase() : '') + (e.side ? ' (' + e.side + ')' : '') + (e.still === 'yes' ? ', still taking it' : e.still === 'no' ? ', stopped' : '');
    }
    return [e.name, e.dose].filter(Boolean).join(' ') + (e.freq ? ', ' + e.freq : '');
  }
  function fmtAnswer(n, v) {
    if (v === DISCUSS) return "I'd rather talk about this with the doctor";
    if (v === SKIP) return 'Skipped';
    if (n.type === 'choice' || n.type === 'scale') return optLabel(n, v);
    if (n.type === 'multi') return v.map(x => optLabel(n, x)).join(', ');
    if (n.type === 'date') return fmtDate(v);
    if (n.type === 'list') return v.map(e => fmtEntry(n, e)).join('\n');
    return String(v);
  }
  function estimate(a) {
    let done = 0, left = 0;
    for (const n of Q) {
      if (!isQ(n)) continue;
      const w = W[n.type] || 6;
      if (n.id in a) { if (visible(n, a)) done += w; continue; }
      let p = 1;
      if (n.when) {
        const known = (n.deps || []).every(d => d in a);
        p = known ? (visible(n, a) ? 1 : 0) : (n.p != null ? n.p : 0.3);
      }
      left += w * p;
    }
    return { done, left };
  }
  const total = (a, ids) => (ids.every(k => typeof a[k] === 'number') ? ids.reduce((s, k) => s + a[k], 0) : null);
  const phqBand = s => (s <= 4 ? 'minimal' : s <= 9 ? 'mild' : s <= 14 ? 'moderate' : s <= 19 ? 'moderately severe' : 'severe');
  const gadBand = s => (s <= 4 ? 'minimal' : s <= 9 ? 'mild' : s <= 14 ? 'moderate' : 'severe');
  const node = id => Q.find(n => n.id === id);
  const val = (a, k) => (a[k] === DISCUSS || a[k] === SKIP ? undefined : a[k]);
  const lab = (k, v) => optLabel(node(k), v);
  const lows = (k, arr, map) => (arr || []).map(v => (map && map[v]) || lab(k, v).toLowerCase());

  /* ---------- reading typed answers (word lists, no AI) ---------- */
  // Each typed answer before beforeId (all of them without it) as [question, text], list entries included, with curly apostrophes made straight.
  function typedAnswers(a, beforeId) {
    const end = beforeId ? Q.findIndex(n => n.id === beforeId) : Q.length;
    return TYPED.filter(n => n.id in a && a[n.id] !== SKIP && a[n.id] !== DISCUSS && Q.indexOf(n) < end && visible(n, a))
      .map(n => [n, (n.type === 'list' ? a[n.id].map(e => n.fields.filter(f => !f.options).map(f => e[f.k]).filter(Boolean).join(', ')).join('. ') : String(a[n.id])).replace(/[‘’]/g, "'")]);
  }
  // The sentence a match is in, or ten words either side when the sentence runs long, so a flag shows the patient's own phrasing.
  function excerpt(s, i, j) {
    let a = 0, b = s.length, m;
    const stop = /[.!?]+(?=\s|$)|\n+/g;
    while ((m = stop.exec(s))) { const end = m.index + m[0].length; if (end <= i) a = end; else if (m.index >= j) { b = m[0][0] === '\n' ? m.index : end; break; } }
    while (a < b && /\s/.test(s[a])) a++;
    const t = s.slice(a, b).trim(), w = [...t.matchAll(/\S+/g)];
    if (w.length <= 30) return (a > 0 ? '…' : '') + t;
    let p = w.findIndex(x => x.index + x[0].length > i - a), q = w.findIndex(x => x.index + x[0].length >= j - a);

  // The testing version (the trial page) opens on a sign-in for its test accounts, each kept as the SHA-256 of its email
  // and password, and gives each account its own clinic that starts empty and, unlike the demo, keeps from day to day.
  const trialAccounts = ((document.querySelector('meta[name="practice-trial"]') || {}).content || '').split(',').map(s => s.trim()).filter(Boolean);
  const trial = trialAccounts.length > 0;
  let KEY = 'psych-practice-demo-v1';

  function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* the demo still works without storage */ } }
  let saveTimer = null;

  // The demo starts over each day, since its made-up patients are dated from today.
  function loadStore() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.v === 1 && (trial || s.day === ymd(clinicDay))) return s; } catch (e) { /* start fresh */ } return null; }

  const reviewOf = p => (p.intake.status === 'done' && p.intake.A ? flags(p.intake.A).review : []);
  // Safety answers keep a patient at the top of Today until someone reaches them; a message left doesn't count.
  const needsCall = p => urgentOf(p).length > 0 && (!p.safetyAck || /^Left a message/.test(p.safetyAck.outcome));
  const safetyChip = p => (urgentOf(p).length ? chip(needsCall(p) ? (p.safetyAck ? 'Safety: message left' : 'Safety answers') : 'Safety: contacted', needsCall(p) ? 'danger' : 'warn') : null);
  const scoresOf = p => (p.intake.A ? { phq: total(p.intake.A, PHQ), gad: total(p.intake.A, GAD) } : { phq: null, gad: null });

  const dueTasks = () => S.tasks.filter(t => !t.done && t.who === role && t.due <= at(0, 23, 59));
  function doneTaskKey(key) { S.tasks.forEach(t => { if (t.key === key && !t.done) { t.done = true; t.doneAt = Date.now(); } }); }
  const chip = (text, tone) => h('span', { class: 'chip-s' + (tone ? ' ' + tone : '') }, text);
  const intakeChip = p => { const [t, tone] = INTAKE_STATUS[p.intake.status] || INTAKE_STATUS.none; return chip(t, needsCall(p) ? 'danger' : tone); };
  const apptChip = a => { const [t, tone] = APPT_STATUS[a.status]; return chip(t, tone); };
  function btn(label, onclick, kinds, extra) { return h('button', Object.assign({ class: 'btn' + (kinds ? ' ' + kinds.split(' ').map(k => 'btn-' + k).join(' ') : ''), type: 'button', onclick }, extra || {}), label); }

  function appendQuestion(n) { divider(n); log.append(h('div', { class: 'msg bot' }, n.eyebrow ? h('span', { class: 'eyebrow' }, n.eyebrow) : null, qText(n, A))); }
  function appendAnswer(n) { const v = A[n.id]; log.append(h('div', { class: 'msg me' + (v === SKIP || v === DISCUSS ? ' quiet' : '') }, fmtAnswer(n, v))); }

  }
  function back() {
    if (busy) return;

    if (last < 0) return;
    for (let i = last; i < Q.length; i++) { delete A[Q[i].id]; delete T[Q[i].id]; }
    if (!Object.keys(A).length) started = null;

  }
  function progress() {

    return row.childNodes.length ? row : document.createDocumentFragment();
  }
  function nameProblem(v, isFirst) {
    if (!v) return isFirst ? 'Please enter your first name.' : '';

    if (!/^[\p{L}\p{M}'’.() -]+$/u.test(v) || !/\p{L}/u.test(v)) return `Please use letters only in your ${part} name, like ${isFirst ? 'Sam or Mary-Jane' : "Lee or O'Brien"}.`;
    if (v.split(' ').length > (isFirst ? 2 : 3)) return isFirst ? 'Just your first name here, in one or two words.' : 'Your last name can be up to three words.';
    if (v.length > (isFirst ? 30 : 40)) return `That's too long for a ${part} name.`;

  }
  const tidyName = s => (s === s.toLowerCase() ? s.replace(/(^|[\s'’(-])(\p{L})/gu, (m, q, c) => q + c.toUpperCase()) : s);
  function showComposer(n) {
    comp.textContent = '';

    } else if (n.type === 'text' || n.type === 'short') {
      const long = n.type === 'text';
      const input = long ? h('textarea', { id: 'ans-' + n.id, rows: '4', placeholder: n.ph || 'Type your answer', 'aria-label': qText(n, A) }) : h('input', { id: 'ans-' + n.id, type: 'text', placeholder: n.ph || 'Type your answer', 'aria-label': qText(n, A), autocomplete: 'off' });

      input.addEventListener('input', () => { send.disabled = !input.value.trim(); });
      input.addEventListener('keydown', e => { if (e.key === 'Enter' && (!long || e.metaKey || e.ctrlKey)) { e.preventDefault(); send.click(); } });
      comp.append(input, h('div', { class: 'row' }, send, long ? h('p', { class: 'hint grow' }, 'Tip: tap the microphone on your keyboard to speak instead of typing.') : null), extras(n));
      setTimeout(() => input.focus({ preventScroll: true }), 0);
    } else if (n.type === 'name') {
      const box = (k, label, max, auto) => { const ctrl = h('input', { id: 'ans-' + n.id + '-' + k, type: 'text', maxlength: String(max), autocomplete: auto, 'aria-describedby': 'err-' + n.id }); return { ctrl, wrap: h('label', { class: 'field', for: ctrl.id }, h('span', null, label), ctrl) }; };
      const boxes = [box('first', 'First name', 30, 'given-name'), box('last', 'Last name (optional)', 40, 'family-name')];
      const err = h('p', { class: 'error', id: 'err-' + n.id, role: 'alert', hidden: true });
      const send = h('button', { class: 'btn btn-primary', type: 'button', disabled: true, onclick: () => {
        const v = boxes.map(b => b.ctrl.value.trim().replace(/\s+/g, ' ')), bad = v.map((s, i) => nameProblem(s, i === 0));
        boxes.forEach((b, i) => b.ctrl.setAttribute('aria-invalid', String(!!bad[i])));

        answer(n, v.filter(Boolean).map(tidyName).join(' '));
      } }, 'Send');
      boxes[0].ctrl.addEventListener('input', () => { send.disabled = !boxes[0].ctrl.value.trim(); });
      boxes.forEach(b => b.ctrl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!send.disabled) send.click(); } }));
      comp.append(h('div', { class: 'fields' }, boxes.map(b => b.wrap)), err, h('div', { class: 'row' }, send), extras(n));
      setTimeout(() => boxes[0].ctrl.focus({ preventScroll: true }), 0);
    } else if (n.type === 'date') {
      const input = h('input', { id: 'ans-' + n.id, type: 'date', min: '1900-01-01', max: new Date().toISOString().slice(0, 10), 'aria-label': qText(n, A) });
      const next = h('button', { class: 'btn btn-primary', type: 'button', disabled: true, onclick: () => { if (input.value) answer(n, input.value); } }, 'Next');
      const sync = () => { next.disabled = !input.value; };

    } else if (n.type === 'list') {
      const items = [], entries = h('div', { class: 'entries' });
      const fields = n.fields.map(f => { const id = 'f-' + n.id + '-' + f.k; const ctrl = f.options ? h('select', { id }, h('option', { value: '' }, 'Choose...'), f.options.map(o => h('option', { value: o[0] }, o[1]))) : h('input', { id, type: 'text', placeholder: f.ph || '' }); return { f, ctrl, wrap: h('label', { class: 'field', for: id }, h('span', null, f.label), ctrl) }; });

  }
  function showEnd() {
    comp.textContent = '';
    comp.append(h('p', { class: 'hint', role: 'status' }, 'Thank you. Your answers went to the clinic. In this demo they appear in the patient file.'),
      h('div', { class: 'row' }, h('button', { class: 'btn btn-primary', type: 'button', onclick: () => { const pid = chatPid; closePatientView(); openPatient(pid, 'intake'); } }, 'See it in the patient file'), h('button', { class: 'btn', type: 'button', onclick: askReset }, 'Start over')));
  }
  let confirmAction = null;
  function closeMenu() { $('menu').hidden = true; $('moreBtn').setAttribute('aria-expanded', 'false'); }
  function ask(text, yes, fn) { closeMenu(); $('confirmText').textContent = text; $('confirmYes').textContent = yes; confirmAction = fn; $('confirm').hidden = false; $('confirmYes').focus(); }
  function askReset() { ask('Clear all the answers and start again?', 'Clear answers', reset); }

  // Testing shortcut: a made-up patient answers everything, keeping this patient's own name, birth date and pronouns.
  // The story suits the patient: the anxious professional or new parent for she/her, the bereaved retiree for older men, the student for everyone else.
  function personaFor(p) {
    const age = ageOf(p);
    if (p.pronouns === 'she') return age != null && age >= 20 && age <= 42 && Math.random() < 0.35 ? 2 : 0;
    return p.pronouns === 'he' && age != null && age >= 55 ? 3 : 1;
  }
  function fillTestPatient() {
    const p = P(chatPid), over = { name: p.name, dob: p.dob };
    if (['she', 'he', 'they'].includes(p.pronouns)) Object.assign(over, { pronouns: p.pronouns, gender: { she: 'woman', he: 'man', they: 'nonbinary' }[p.pronouns] });
    const r = testPatient(personaFor(p), over);
    A = r.a; T = r.t; started = r.start; saveChat(); renderAll(); finishIntake();
    const pid = chatPid; closePatientView(); openPatient(pid, 'intake', { intakeTab: 'ai' });
  }
  function askFill() { if (Object.keys(A).some(k => k !== 'start')) ask('Replace these answers with a random test patient?', 'Replace answers', fillTestPatient); else { closeMenu(); fillTestPatient(); } }
  $('backBtn').addEventListener('click', back);
  $('moreBtn').addEventListener('click', ev => { ev.stopPropagation(); const open = $('menu').hidden; $('menu').hidden = !open; $('moreBtn').setAttribute('aria-expanded', String(open)); });
  document.addEventListener('click', ev => { if (!$('menu').hidden && !ev.target.closest('.menu-wrap')) closeMenu(); });
  $('menuFill').addEventListener('click', askFill);
  $('menuReset').addEventListener('click', askReset);
  $('confirmYes').addEventListener('click', () => { const fn = confirmAction; confirmAction = null; $('confirm').hidden = true; if (fn) fn(); });
  $('confirmNo').addEventListener('click', () => { $('confirm').hidden = true; });
  $('phoneClose').addEventListener('click', closePatientView);

  /* ---------- wiring ---------- */
  document.addEventListener('keydown', ev => {

    if (!$('overlay').hidden) closeDialog();
  });
  // The name menu at the top right, as in Jane: who the clinic is viewed as, Claude, starting over and signing out.
  function syncAcct() {
    $('acctName').textContent = role === 'doctor' ? CLINIC.doctor : 'Sam (admin)';
    $('acctMenu').querySelectorAll('[data-role]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.role === role)));
  }
  function setRole(r) { role = r === 'admin' ? 'admin' : 'doctor'; try { localStorage.setItem(KEY + ':role', role); } catch (e) { /* per-viewer convenience only */ } syncAcct(); render(); toast(`Now viewing as ${roleName()}.`); }
  $('acctBtn').addEventListener('click', ev => { ev.stopPropagation(); const list = $('acctMenu'), open = list.hidden; closeMenus(); list.hidden = !open; $('acctBtn').setAttribute('aria-expanded', String(open)); });

  const SESSION = 'psych-practice-trial:session';
  // An account is the SHA-256 of its email (trimmed, lower case), a newline and its password; its first 16 characters
  // name its clinic in this browser's storage. The page never holds the email itself.
  async function accountFor(email, password) {
    const bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(email.trim().toLowerCase() + '\n' + password)));
    const hex = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');

  function showSignIn() {
    const email = h('input', { id: 'siEmail', type: 'email', autocomplete: 'username', autocapitalize: 'off', spellcheck: 'false' });

  function boot() {
    S = loadStore();

    if (S.patients.some(p => p.intake.status === 'paper')) {

    syncClaudeBtn();
    buildNav();
    window.addEventListener('hashchange', routeFromHash);
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(fn => { sampleFn = fn || null; sampleState = fn ? 'ready' : 'off'; softRender(); }, () => { sampleFn = null; sampleState = 'off'; softRender(); });
    }
    routeFromHash();
  }
  if (!trial) boot();
  else if (signedInAccount()) enterTrial(signedInAccount());
  else showSignIn();
})();
